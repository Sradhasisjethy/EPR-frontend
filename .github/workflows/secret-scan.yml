# Fails a push or pull request that would publish a credential.
#
# Everything under VITE_* is compiled into the public bundle, so a server secret
# given that prefix is published the moment it is built — this catches the file
# side; reviewers must still never prefix a secret with VITE_. Enable GitHub
# secret scanning and push protection in the repository settings as well.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No secrets in tracked files (gitleaks, values redacted)
        uses: docker://zricethezav/gitleaks:v8.18.4
        with:
          args: detect --no-git --source . --redact --verbose --exit-code 1

      - name: No environment, key or build files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|\.map$|^dist/' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Tracked files that must not be published:"; echo "$bad"; exit 1; fi

      - name: Only public settings use the VITE_ prefix
        run: |
          bad=$(grep -rhoE 'VITE_[A-Z0-9_]+' src .env.example | sort -u | grep -vE '^VITE_API_URL$' || true)
          if [ -n "$bad" ]; then echo "Unreviewed VITE_ variables (compiled into the public bundle):"; echo "$bad"; exit 1; fi
